function t(k){return LANGS[lang][k]||LANGS.en[k]||k;}

function applyTheme(th){
  theme = th;
  const r = document.documentElement.style;
  r.setProperty('--p1',th.p1);r.setProperty('--p2',th.p2);
  r.setProperty('--p-light',th.pl);r.setProperty('--p-mid',th.pm);
  r.setProperty('--ep1',th.ep1);r.setProperty('--ep2',th.ep2);
  r.setProperty('--ep-light',th.epl);
  document.querySelectorAll('.color-dot').forEach((d,i)=>{
    d.classList.toggle('sel',THEMES[i]===th);
  });
  renderScreen();
}

function buildColorBar(){
  const bar = document.getElementById('colorBar');
  bar.innerHTML='<span style="color:rgba(255,255,255,0.4);font-size:11px;font-weight:700;padding:8px 0;">Theme:</span>';
  THEMES.forEach((th,i)=>{
    const d=document.createElement('div');
    d.className='color-dot'+(th===theme?' sel':'');
    d.style.background=th.dot;
    d.title=th.name;
    d.onclick=()=>applyTheme(th);
    bar.appendChild(d);
  });
}

function buildLangBar(){
  const bar=document.getElementById('langBar');
  bar.innerHTML='';
  [['en','EN'],['hi','हिं'],['gu','ગુ']].forEach(([k,lbl])=>{
    const b=document.createElement('button');
    b.className='lang-btn'+(lang===k?' on':'');
    b.textContent=lbl;
    b.onclick=()=>{lang=k;buildLangBar();renderScreen();};
    bar.appendChild(b);
  });
}

function buildNav(){
  const pills=document.getElementById('navPills');
  const map=curType==='e'?EMP_SCREENS:EMPR_SCREENS;
  pills.innerHTML=Object.entries(map).map(([k,v])=>`
    <button class="npill ${curScreen===k?(curType==='e'?'on':'emp-on'):''}" onclick="goTo('${k}')">${v.label}</button>
  `).join('');
}

function switchType(t){
  curType=t;
  document.querySelectorAll('.type-tab').forEach((b,i)=>{
    b.classList.toggle('on',(t==='e'&&i===0)||(t==='em'&&i===1));
  });
  curScreen=Object.keys(t==='e'?EMP_SCREENS:EMPR_SCREENS)[0];
  buildNav();renderScreen();
}

function goTo(s,extra){
  curScreen=s;
  if(extra)manageJobId=extra;
  buildNav();renderScreen();
}

function renderScreen(){
  const sc=document.getElementById('appScreen');
  sc.innerHTML='';
  const fn = curType==='e' ? empScreens[curScreen] : emprScreens[curScreen];
  if(fn) fn(sc);
}

// --- API Integration Setup ---
const API_BASE = 'http://localhost:8000/api';

window.currentUser = null;
window.currentProfile = null;

// Step 0: Check mobile status before sending OTP
async function apiCheckMobile(role) {
  const isEmp = role === 'e';
  const mobile = document.getElementById(isEmp ? 'emp-mobile' : 'empr-mobile').value;
  if(!mobile || mobile.length !== 10) return;

  const apiRole = isEmp ? 'employee' : 'employer';

  try {
    let res = await fetch(API_BASE + '/auth/check-mobile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ mobile: mobile, role: apiRole })
    });
    let data = await res.json();

    if(data.role_mismatch) {
      alert('⚠️ ' + data.message + ' Please switch to ' + data.correct_type + ' login.');
      return false;
    }

    if(!data.exists) {
      console.log('New user — will register after OTP');
    } else {
      console.log('Existing user — profile_complete: ' + data.profile_complete);
    }
    return true;
  } catch(e) {
    console.warn('Check mobile failed: ' + e);
    return true; // Allow to proceed even if check fails
  }
}

// Step 1: Send OTP (with role validation)
async function apiSendOtp(role) {
  const isEmp = role === 'e';
  const mobile = document.getElementById(isEmp ? 'emp-mobile' : 'empr-mobile').value;
  if(!mobile) return alert('Please enter mobile number');

  // Pre-check mobile status
  const canProceed = await apiCheckMobile(role);
  if(canProceed === false) return;

  const apiRole = isEmp ? 'employee' : 'employer';

  try {
    let res = await fetch(API_BASE + '/auth/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ mobile: mobile, role: apiRole })
    });
    let data = await res.json();

    if(data.role_mismatch) {
      alert('⚠️ ' + data.message);
      return;
    }

    if(data.success) {
      alert('OTP Sent! ' + (data.otp_code ? ('(Dev OTP: ' + data.otp_code + ')') : 'Check SMS'));
      // In dev we auto-fill the OTP because it's returned
      if(data.otp_code) {
         let otpEl = document.getElementById(isEmp ? 'emp-otp' : 'empr-otp');
         if(otpEl) otpEl.value = data.otp_code;
      }
    } else {
      alert('Error: ' + (data.message || JSON.stringify(data.errors)));
    }
  } catch(e) {
    alert('Failed to connect to API: ' + e);
  }
}

// Step 2: Verify OTP & Login
async function apiLogin(role) {
  const isEmp = role === 'e';
  const mobile = document.getElementById(isEmp ? 'emp-mobile' : 'empr-mobile').value;
  const otp = document.getElementById(isEmp ? 'emp-otp' : 'empr-otp')?.value;
  
  if(!mobile || !otp) return alert('Please enter mobile and OTP');

  try {
    // First try /auth/login (for existing users)
    let res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ mobile: mobile, otp_code: otp })
    });
    let data = await res.json();

    // If user not found, try verify-otp flow (handles new user registration)
    if(!data.success && res.status === 404) {
      res = await fetch(API_BASE + '/auth/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ mobile: mobile, otp_code: otp })
      });
      data = await res.json();

      if(data.success && data.is_new_user) {
        // New user — need to register
        const apiRole = isEmp ? 'employee' : 'employer';
        alert('Welcome! Your mobile is verified. Creating your account...');

        const regEndpoint = isEmp ? '/auth/employee/register' : '/auth/employer/register';
        const regBody = isEmp
          ? { mobile: mobile, temp_token: data.temp_token }
          : { mobile: mobile, temp_token: data.temp_token, company_name: 'My Company', email: mobile + '@temp.com', password: 'password123', password_confirmation: 'password123', location: 'India', company_size: '1-10' };

        const regRes = await fetch(API_BASE + regEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(regBody)
        });
        data = await regRes.json();
      }
    }

    if(data.success && data.data && data.data.access_token) {
      localStorage.setItem('jobfindlink_token', data.data.access_token);
      window.currentUser = data.data.user;
      window.currentProfile = data.data.profile;

      const userName = window.currentUser.full_name || 'User';
      alert('Login successful! Welcome ' + userName);

      // Navigate based on next_screen from API
      if(data.data.next_screen) {
        const ns = data.data.next_screen;
        if(ns.includes('employer')) {
          curType = 'em';
          curScreen = 'dashboard';
        } else {
          curType = 'e';
          curScreen = 'dashboard';
        }
        buildNav();
      }
      goTo('dashboard');
    } else {
      alert('Login failed: ' + (data.message || 'Invalid OTP'));
    }
  } catch(e) {
    alert('Login error: ' + e);
  }
}

async function apiLoadProfile() {
  const token = localStorage.getItem('jobfindlink_token');
  if(!token) {
     renderScreen();
     return;
  }
  
  try {
    let res = await fetch(API_BASE + '/auth/profile', {
      headers: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + token }
    });
    let data = await res.json();
    if(data.success) {
      window.currentUser = data.data.user;
      window.currentProfile = data.data.profile;
      
      // Check role to set app context
      if(window.currentUser.role === 'employer') {
         curType = 'em';
         curScreen = 'dashboard';
      } else {
         curType = 'e';
         curScreen = 'dashboard';
      }
      buildNav();
    } else {
      // Token expired or invalid — clear it
      localStorage.removeItem('jobfindlink_token');
    }
  } catch(e) {
    console.warn('Silent auth check fail: ' + e);
  }
  renderScreen();
}

// Kick off
apiLoadProfile();
